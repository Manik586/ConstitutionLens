# V1 configuration for Constitutional Evidence RAG (SRS v4.1 + v4.2 amendment).
#
# Only settings actually consumed by the code are present here. Reranking and
# LLM configuration are added in the phases that introduce them (see
# docs/DECISIONS.md D2) — this file intentionally does not pre-declare sections
# nothing reads yet.

app:
  name: constitutional-evidence-rag
  version: "0.1.0"
  phase: v1

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

paths:
  data_raw_dir: data/raw
  data_processed_dir: data/processed
  indexes_dir: indexes        # Phase 3: indexes/<corpus_id>/{bm25,dense}/

# Phase 2 (SRS FR-03): target 400-600 tokens, 50-100 token overlap. Overlap
# applies only inside one structural unit (an article, a judgment section),
# never across unit boundaries (D16).
chunking:
  target_tokens: 500
  max_tokens: 600
  overlap_tokens: 75

# Phase 3 (SRS FR-05, §39; D17). Model weights download on first use and are
# cached by sentence-transformers (HF_HOME). Changing model_name makes the dense
# index stale: rebuild with scripts/build_indexes.py.
embedding:
  model_name: BAAI/bge-small-en-v1.5
  query_instruction: "Represent this sentence for searching relevant passages: "
  batch_size: 32
  device: cpu

# Phase 3 (SRS FR-05 - FR-07; D18, D19). top_n_hybrid is the candidate list
# Phase 4 reranks (FR-08: 20 -> 5). Weights scale each list's RRF contribution.
retrieval:
  bm25_k1: 1.5
  bm25_b: 0.75
  top_n_bm25: 20
  top_n_dense: 20
  top_n_hybrid: 20
  rrf_k: 60
  weight_bm25: 1.0
  weight_dense: 1.0

# Phase 4 evidence selection (D20). Boosts are locator matches in RRF units,
# never source-type/authority weights (SRS §20.2, FR-SA-05). Confidence floors
# trigger an explicit "insufficient evidence" answer instead of a guess.
evidence:
  candidate_pool: 50
  top_k: 6
  max_per_document: 2
  max_constitutional: 2
  provision_match_boost: 1.0
  case_match_boost: 1.0
  article_mention_boost: 0.01
  min_term_coverage: 0.6
  min_dense_score: null      # set after calibrating on BGE scores (e.g. 0.5)

# Phase 4 answer generation (D21). Extractive = verbatim quotes from evidence
# only; an LLM backend plugs in behind the same interface once chosen.
generation:
  backend: extractive
  sentences_per_item: 2
  max_quote_chars: 450
  show_opinion_author: false   # see D21: Phase 2 author detection has known gaps
  # Phase 5 — LLM backend (D23-D25). `query.py --generate` uses it regardless of `backend`.
  prompt_version: grounded-v1
  context_max_items: 6           # evidence items sent to the LLM, in Phase 4 order
  context_max_chars_per_item: 3000
  context_max_total_chars: 18000

# Phase 5 LLM provider (D23). provider: none = generation disabled, nothing is sent
# anywhere. The API key is read from the environment variable named in api_key_env
# (put it in .env, never here). Corpus evidence goes to a non-localhost base_url only
# when allow_remote is true. Env overrides: LLM_PROVIDER, LLM_MODEL, LLM_BASE_URL.

llm:
  provider: none
  model: gemini-2.5-flash-lite
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key_env: LLM_API_KEY
  require_api_key: true
  allow_remote: false
  temperature: 0.0
  max_output_tokens: 2048
  timeout_seconds: 60
  json_mode: false
  max_retries: 1