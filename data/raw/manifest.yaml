# Curated V1 corpus ("constitutional-core") — docs/DECISIONS.md D8, D14, D15.
# Field rules: data/raw/manifest.example.yaml.
#
# BEFORE RUNNING INGESTION, replace every REPLACE-WITH-SOURCE-URL with the URL of
# the page you downloaded that PDF from (not the path on your computer). Ingestion
# rejects the placeholder on purpose: source_url fixes each document's permanent ID
# (D9). Corpus licensing must also be confirmed before ingestion (D7).
#
# Titles and dates were read from each PDF's printed title page.
# Files are expected under data/raw/constitution/ and data/raw/judgments/.

documents:
  # --- Constitution -----------------------------------------------------------
  # Official text, Legislative Department, Ministry of Law and Justice; amendments
  # up to the Constitution (One Hundred and Sixth Amendment) Act, 2023.
  - file: constitution/constindeng.pdf
    source_type: constitutional_text
    title: The Constitution of India (as on 1st May, 2026)
    source_url: https://www.sci.gov.in/aor-examination/
    source_date: 2026-05-01

  # --- Supreme Court judgments (Supreme Court Reports), by date ----------------
  # [1973] Supp. S.C.R. — 13-judge bench; basic structure doctrine.
  - file: judgments/kesavananda_bharti.pdf
    source_type: judgment
    title: His Holiness Kesavananda Bharati Sripadagalvaru v. State of Kerala
    source_url: https://cdnbbsr.s3waas.gov.in/s3ec0490f1f4972d133619a60c30f3559e/documents/aor_notice_circular/1.pdf
    source_date: 1973-04-24

  # 7-judge bench; Articles 14, 19 and 21.
  - file: judgments/maenkagandhi_unionbank.pdf
    source_type: judgment
    title: Maneka Gandhi v. Union of India
    source_url: https://cdnbbsr.s3waas.gov.in/s3ec0490f1f4972d133619a60c30f3559e/documents/aor_notice_circular/2.pdf
    source_date: 1978-01-25

  # 5-judge bench; Forty-second Amendment, Articles 31C and 368.
  - file: judgments/minerva.pdf
    source_type: judgment
    title: Minerva Mills Ltd. and Ors. v. Union of India and Ors.
    source_url: https://cdnbbsr.s3waas.gov.in/s3ec0490f1f4972d133619a60c30f3559e/documents/aor_notice_circular/3.pdf
    source_date: 1980-07-31

  # 5-judge bench; Tenth Schedule (anti-defection). The report prints two dates,
  # "November 12, 1991 / Feb. 18, 1992"; the later one is used here — confirm it.
  - file: judgments/kihoto_hollohan.pdf
    source_type: judgment
    title: Kihoto Hollohan v. Zachillhu and Others
    source_url: https://cdnbbsr.s3waas.gov.in/s3ec0490f1f4972d133619a60c30f3559e/documents/aor_notice_circular/6.pdf
